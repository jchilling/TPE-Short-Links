services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tpe_short_links
      POSTGRES_USER: tpe
      POSTGRES_PASSWORD: tpe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpe -d tpe_short_links"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
